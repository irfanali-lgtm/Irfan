<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TMC Planner">
<title>TMC Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F6F5F'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231F6F5F'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" id="manifest" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F4; --fg:#1C1E1C; --fg2:#4A4E4A; --muted:#7A7E79; --line:#E2E4DF; --line2:#CDD0CA;
  --accent:#1F6F5F; --accent-fg:#FFFFFF; --accent-soft:#E4F0EC; --danger:#B4423B; --danger-soft:#F6E4E2;
  --h-day:#2E66A8; --h-week:#5E7A2E; --h-month:#A8651E; --h-quarter:#7B4FA0; --h-year:#9B3B4D;
  --field:#FFFFFF; --sheet:#FFFFFF; --scrim:rgba(20,22,21,.42);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --radius:8px; --col:680px;
  box-sizing:border-box;
  padding-top:var(--sat);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141615; --fg:#E9EAE6; --fg2:#C3C6C1; --muted:#8F938E; --line:#272A28; --line2:#3A3E3B;
    --accent:#5DBFA5; --accent-fg:#0F1A17; --accent-soft:#1B2A26; --danger:#E0756E; --danger-soft:#33201F;
    --h-day:#7FA9E0; --h-week:#A2BE66; --h-month:#D99A55; --h-quarter:#B48AD6; --h-year:#D4788A;
    --field:#1B1E1C; --sheet:#1A1D1B; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#141615; --fg:#E9EAE6; --fg2:#C3C6C1; --muted:#8F938E; --line:#272A28; --line2:#3A3E3B;
  --accent:#5DBFA5; --accent-fg:#0F1A17; --accent-soft:#1B2A26; --danger:#E0756E; --danger-soft:#33201F;
  --h-day:#7FA9E0; --h-week:#A2BE66; --h-month:#D99A55; --h-quarter:#B48AD6; --h-year:#D4788A;
  --field:#1B1E1C; --sheet:#1A1D1B; --scrim:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:var(--sat);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font-family:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-size:16px;background:var(--field);border:1px solid var(--line2);border-radius:var(--radius);padding:10px 12px;width:100%;min-height:44px;color:var(--fg)}
textarea{min-height:120px;resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--muted)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
hr{border:0;border-top:1px solid var(--line);margin:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{max-width:1200px;margin:0 auto;padding:0 16px calc(84px + var(--sab))}
.col{max-width:var(--col);margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .greet{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .left{font-size:18px;font-weight:600}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--fg2)}
.iconbtn:hover{background:var(--accent-soft);color:var(--fg)}
.iconbtn svg{width:22px;height:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  display:flex;padding:4px 8px calc(6px + var(--sab))}
nav.tabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);border-radius:var(--radius)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
nav.tabs .topbar{display:none}
@media (min-width:900px){
  .app{padding-bottom:40px}
  header.top{padding:22px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
  nav.tabs{position:static;border:0;padding:0;background:transparent;display:flex;gap:4px;justify-content:center;margin:0 auto}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;min-height:44px;padding:0 16px;font-size:15px}
  nav.tabs button svg{width:18px;height:18px}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft)}
  nav.tabs button:hover{background:var(--accent-soft)}
  nav.tabs .topbar{display:inline}
  .kbd{display:inline}
}
.kbd{display:none;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:6px;line-height:18px}
main{padding-top:6px}
section.view{display:none}
section.view[aria-hidden="false"]{display:block}

/* ---------- Plan ---------- */
.hstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:6px 0 18px}
.hstrip button{display:flex;flex-direction:column;gap:6px;padding:8px 6px 10px;min-height:56px;border-radius:var(--radius);text-align:left;color:var(--fg2)}
.hstrip button:hover{background:var(--accent-soft)}
.hstrip button[aria-selected="true"]{color:var(--fg);background:var(--accent-soft)}
.hstrip .n{font-size:14px;font-weight:600;line-height:1.1;white-space:nowrap}
.hstrip .c{font-size:12px;color:var(--muted);line-height:1}
.hstrip .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.hstrip .bar i{display:block;height:100%;width:0;background:var(--hc,var(--accent))}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.head h2{font-size:30px;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ring{width:56px;height:56px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--hc,var(--accent));stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s}
.ring text{font-size:14px;font-weight:600;fill:var(--fg)}
.addbox{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.addbox input{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--field);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--fg2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
@media (max-width:899px){.btn.sm,.seg button,.chips button,.chipsa button{min-height:44px}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:default}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);min-height:36px;cursor:pointer}
label.chk{min-height:44px}
label.chk input{width:24px;height:24px;min-height:0;padding:0;margin:0;accent-color:var(--accent)}
.rowbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.seg button{min-height:36px;padding:0 12px;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item .circle{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin:-10px 0 -10px -10px}
.item .circle i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.item .circle i svg{width:12px;height:12px;opacity:0;stroke:var(--accent-fg)}
.item.done .circle i{background:var(--accent);border-color:var(--accent)}
.item.done .circle i svg{opacity:1}
.item .body{flex:1;min-width:0}
.item .text{font-size:16px;line-height:1.35;word-break:break-word;cursor:text;min-height:24px}
.item.done .text{color:var(--muted);text-decoration:line-through}
.item .text input{min-height:0;padding:2px 6px;margin:-3px -6px;border-color:var(--accent)}
.item .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.item .meta .imp{color:var(--h-month)}
.item .note{font-size:14px;color:var(--fg2);margin-top:4px;white-space:pre-wrap}
.item .more{width:44px;height:44px;flex:none;margin:-10px -10px -10px 0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:50%}
.item .more:hover{background:var(--accent-soft);color:var(--fg)}
.item.open .more{color:var(--accent)}
.tools{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.tools .wide{grid-column:1/-1}
.tools .btn{justify-content:flex-start}
@media (min-width:600px){.tools{grid-template-columns:repeat(3,1fr)}}
.tools select,.tools textarea{min-height:44px}
.empty{padding:28px 0;color:var(--muted);text-align:center;font-size:15px}
.empty b{color:var(--fg);font-weight:600;display:block;margin-bottom:4px}
.block{margin:22px 0 10px}
.block h3{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.block h3 .tiny{font-weight:400}
.strip{border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px}
.srow .t{flex:1;min-width:0;font-size:15px}
.srow .t .tiny{display:block}
.srow .acts{display:flex;gap:4px;flex:none}
.srow .acts .btn{padding:0 10px}
.srow .acts select{width:auto;max-width:150px}
.srow .t a,.rec .fields a{display:inline-flex;align-items:center;min-height:44px;margin:-10px 0}
@media (max-width:899px){.srow{flex-wrap:wrap}.srow .t{flex:1 1 180px}.srow .acts{margin-left:auto}}
.when{color:var(--muted);font-size:14px;flex:none;width:56px}
.carry{border-left:3px solid var(--line2);padding-left:12px;margin:4px 0 14px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg2);line-height:18px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:18px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--fg2)}

/* ---------- Dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 10px}
.tiles .tile{padding:12px 8px;border-top:3px solid var(--hc);min-height:88px;cursor:pointer;border-radius:4px 4px 0 0}
.tiles .tile:hover{background:var(--accent-soft)}
.tiles .pct{font-size:24px;font-weight:600;line-height:1}
.tiles .lbl{font-size:13px;font-weight:600;margin-top:6px}
.tiles .sub{font-size:12px;color:var(--muted);line-height:1.3}
@media (max-width:480px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}.tiles .pct{font-size:19px}.tiles .tile{padding:10px 4px}.tiles .lbl{font-size:12px}.tiles .sub{font-size:11px}}
.tree{list-style:none;margin:0;padding:0}
.tree li{padding:0}
.tree .node{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line)}
.tree .node .t{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .node .t.done{color:var(--muted);text-decoration:line-through}
.tree .node .p{font-size:13px;color:var(--muted);flex:none;width:44px;text-align:right}
.tree .node .pb{width:60px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}
.tree .node .pb i{display:block;height:100%;background:var(--hc)}
.tree .node .dot{width:8px;height:8px;border-radius:50%;background:var(--hc);flex:none}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px}
@media (max-width:480px){.tree .node .pb{width:40px}.tree ul{padding-left:14px}}
.chart{width:100%;height:120px;display:block;margin:8px 0 4px}
.chart rect{fill:var(--accent)}
.chart rect.z{fill:var(--line)}
.chart text{font-size:10px;fill:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 32px}
.dgrid>div{min-width:0}
@media (min-width:900px){.dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* ---------- Repository ---------- */
.rtop{display:flex;gap:8px;margin:8px 0}
.rtop input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 8px}
.chips button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:14px;color:var(--fg2);white-space:nowrap}
.chips button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rec{padding:12px 0;border-bottom:1px solid var(--line)}
.rec .rh{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:32px}
.rec .rh .n{font-weight:600;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .rh .due{font-size:13px;color:var(--muted);flex:none}
.rec .rh .due.over{color:var(--danger)}
.rec .fields{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:14px}
.rec .fields .k{color:var(--muted);white-space:nowrap}
.rec .fields .v{word-break:break-word}
.rec .racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.form{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
@media (min-width:600px){.form{grid-template-columns:1fr 1fr}.form label.wide{grid-column:1/-1}}
.form .fa{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Sheets / overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim[data-open="true"]{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--sheet);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;max-height:92vh;max-height:92dvh;display:none;flex-direction:column;
  transform:translateY(12px);opacity:0;transition:transform .18s ease,opacity .18s ease}
.sheet[data-open="true"]{display:flex;transform:none;opacity:1}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px 18px;border-bottom:1px solid var(--line)}
.sheet .sh h2{font-size:17px}
.sheet .sb{overflow-y:auto;padding:14px 18px calc(18px + var(--sab));-webkit-overflow-scrolling:touch;flex:1}
.sheet.wide .sb{max-width:var(--col);margin:0 auto;width:100%}
@media (min-width:900px){
  .sheet{left:50%;right:auto;bottom:auto;top:8vh;width:720px;transform:translate(-50%,8px);border-radius:12px;border:1px solid var(--line);max-height:84vh}
  .sheet[data-open="true"]{transform:translate(-50%,0)}
  .sheet.drawer{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;border-radius:0;border-left:1px solid var(--line);border-top:0;transform:translateX(12px)}
  .sheet.drawer[data-open="true"]{transform:none}
}
.srows{display:flex;flex-direction:column;gap:14px}
.srows label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg2)}
.srows .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;flex-direction:column;gap:8px}
.check .c{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.check .c b{font-weight:600}
.check .c .ok{color:var(--accent)}.check .c .bad{color:var(--danger)}
.check .c .fix{color:var(--fg2);font-size:13px}

/* ---------- Assistant ---------- */
.fab{position:fixed;right:16px;bottom:calc(74px + var(--sab));z-index:35;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;letter-spacing:.01em}
.fab:hover{filter:brightness(1.08)}
.fab:active{transform:scale(.96)}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{max-width:92%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--accent-soft);border-bottom-left-radius:4px}
.msg.s{align-self:center;font-size:13px;color:var(--muted);background:none;padding:2px 0}
.msg.e{align-self:flex-start;color:var(--danger);background:var(--danger-soft)}
.msg .conf{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.msg .conf button{color:var(--accent);font-weight:600;min-height:28px;padding:0 6px}
.draft{border:1px solid var(--line2);border-radius:var(--radius);padding:10px 12px;margin-top:8px;background:var(--field);color:var(--fg)}
.draft .s{font-weight:600;margin-bottom:4px}
.draft .b{white-space:pre-wrap;font-size:14px;color:var(--fg2);max-height:200px;overflow:auto}
.draft .da{display:flex;gap:6px;margin-top:8px}
.msg.a .draft a{color:var(--accent)}
.ain{display:flex;gap:6px;align-items:flex-end;padding:10px 12px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--sheet)}
.ain textarea{flex:1;min-height:44px;max-height:120px;resize:none;padding:10px 12px}
.ain .iconbtn{border:1px solid var(--line2);border-radius:var(--radius);width:44px;height:44px;flex:none}
.ain .iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ain .iconbtn.live[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:#fff}
.chipsa{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 2px}
.chipsa button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:14px;color:var(--fg2);white-space:nowrap}
.chipsa button:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);padding:6px 18px}
.interim{font-size:14px;color:var(--muted);font-style:italic;padding:0 18px 6px;min-height:18px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 13px}
.typing i{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:50%;margin-right:3px;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- Toast / confirm ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));z-index:60;background:var(--fg);color:var(--bg);
  padding:10px 10px 10px 16px;border-radius:var(--radius);display:none;align-items:center;gap:12px;font-size:14px;max-width:calc(100% - 32px)}
.toast[data-open="true"]{display:flex}
.toast button{color:var(--accent);font-weight:600;min-height:32px;padding:0 10px;color:#9FE0CB}
.toast .x{color:var(--bg);opacity:.7}
@media (min-width:900px){.toast{bottom:28px}}
.confirm{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(92vw,420px);display:none}
.confirm[data-open="true"]{display:block}
.confirm p{margin:0 0 16px}
.confirm .ca{display:flex;gap:8px;justify-content:flex-end}

/* ---------- Import review ---------- */
.drop{border:1px dashed var(--line2);border-radius:var(--radius);padding:14px;text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.drop.over{border-color:var(--accent);color:var(--accent)}
.rv{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line)}
.rv .t{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv select{width:auto;min-height:44px;padding:4px 8px;font-size:16px}
.rv input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;margin:10px 4px;accent-color:var(--accent);flex:none}

var HORIZONS = ['day', 'week', 'month', 'quarter', 'year'];

function parseYmd(key) { var p = key.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }

/** Today's date key in Asia/Karachi regardless of device timezone. */

function periodKeys(dayKey) {

    day: dayKey,
    week: mondayOf(dayKey),
    month: p.y + '-' + pad(p.m),

/** Start and end day keys (inclusive) of a period. */
function periodRange(horizon, period) {

function daysLeft(horizon, period, today) {

}

/** Sort key for comparing periods of the same horizon. */
function periodOrder(horizon, period) { return periodRange(horizon, period).start; }
function isEarlier(horizon, period, current) { return periodOrder(horizon, period) < periodOrder(horizon, current); }

function fmtDay(key, withYear) {
  var p = parseYmd(key);

  var left = daysLeft(horizon, period, today);
  var r = periodRange(horizon, period);

  switch (horizon) {
    case 'day': lbl = fmtDay(period); break;
    case 'week': lbl = fmtShort(r.start) + ' – ' + fmtShort(r.end); break;
    case 'month': { var p = parseYmd(r.start); lbl = MONTHS[p.m - 1] + ' ' + p.y; break; }

    case 'year': lbl = period; break;

function hIndex(h) { return HORIZONS.indexOf(h); }
function smallerHorizons(h) { return HORIZONS.slice(0, hIndex(h)); }

/** Progress of an item: done → 1; else average of children; else 0. */
function progressOf(item, byParent, memo) {
  memo = memo || {};

  if (item.done) return (memo[item.id] = 1);

function periodStats(items, horizon, period) {

/** Map a spreadsheet row (array) to an item using a header row. */
function rowToItem(header, row) {

/**
 * Apply assistant actions to a state snapshot. Pure: returns new items/repo plus a change list.
 * ctx: {keys, newId(), today}
 */
function applyActions(actions, state, ctx) {
  var items = state.items.slice();
  var repo = state.repo.slice();
  var changes = [];   // {kind, summary, undo:{...}}
  var effects = [];   // {type:'draft_email'|'set_view'|'open_record'|'plan_goal'|'suggest'|'summarize'|'ask', ...}
  var needsConfirm = [];
  var byId = {};
  items.forEach(function (it) { byId[it.id] = it; });
  var now = ctx.nowIso || new Date().toISOString();

  function findItem(ref) {
    if (!ref) return null;

    var low = String(ref).toLowerCase();
    return items.filter(function (it) { return !it.done && it.text.toLowerCase() === low; })[0] ||

  }
  function patchItem(id, patch) {
    var idx = items.findIndex(function (it) { return it.id === id; });

  }

  (actions || []).forEach(function (a) {
    switch (a.type) {
      case 'add_items': {

        break;

      case 'complete':

        var done = a.type === 'complete';
        var hit = (a.ids || (a.id ? [a.id] : [])).map(findItem).filter(Boolean);
        if (hit.length > 5) { needsConfirm.push({ action: a, count: hit.length }); break; }

        });

      }
      case 'move': {

        if (mi && HORIZONS.indexOf(a.horizon) >= 0) {

          changes.push({ kind: 'move', summary: 'Moved "' + mi.text + '" to ' + HLABEL[a.horizon].toLowerCase(), before: r2.before });
        }
        break;
      }
      case 'set_important': {
        var si = findItem(a.id);

      }
      case 'delete_items': {
        var del = (a.ids || (a.id ? [a.id] : [])).map(findItem).filter(Boolean);
        if (del.length) needsConfirm.push({ action: a, count: del.length, ids: del.map(function (x) { return x.id; }) });
        break;
      }

      case 'set_view': effects.push({ type: 'set_view', tab: a.tab || 'plan', horizon: a.horizon || '' }); break;

      case 'summarize': effects.push({ type: 'summarize', period: a.period || 'day' }); break;

/** Heuristic text → plan items (mirrors Code.gs fallback). */
function heuristicImport(text) {
  var lines = String(text || '').split(/\r?\n/), horizon = 'week', out = [], stack = [], n = 0;
  lines.forEach(function (raw) {
    var line = raw.replace(/\t/g, '    ');
    if (!line.trim()) return;
    var head = line.trim().toLowerCase().replace(/[#*:\-–—]/g, '').trim(), h = null;
    if (/^(today|aaj|daily)\b/.test(head)) h = 'day';
    else if (/^(this week|week|weekly|is hafte)\b/.test(head)) h = 'week';
    else if (/^(this month|month|monthly|january|february|march|april|may|june|july|august|september|october|november|december)\b/.test(head)) h = 'month';
    else if (/^(q[1-4]|this quarter|quarter|quarterly)\b/.test(head)) h = 'quarter';
    else if (/^(this year|year|annual|yearly|20\d\d)\b/.test(head)) h = 'year';
    if (h && (line.trim().length < 40 || /^#/.test(line.trim()))) { horizon = h; stack = []; return; }
    var indent = line.match(/^\s*/)[0].length;
    var t = line.trim().replace(/^([-*•]|\d+[.)])\s*/, '').replace(/^\[.\]\s*/, '').trim();
    if (!t) return;
    while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
    var key = 'k' + (++n);
    out.push({ key: key, parentKey: stack.length ? stack[stack.length - 1].key : '', horizon: horizon, text: t.slice(0, 80) });
    stack.push({ indent: indent, key: key });
  });
  return out;
}

function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

<script>
/* ============================================================ Render */
var $ = function (id) { return document.getElementById(id); };
var renderScheduled = false;
function render() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(function () {
    renderScheduled = false;
    var active = document.activeElement, focusId = active && active.id, sel = null, val = null;
    if (focusId && active.dataset && active.dataset.draft !== undefined) { sel = [active.selectionStart, active.selectionEnd]; val = active.value; }
    renderHeader();
    renderPlan();
    renderDashboard();
    renderRepository();
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)); });
    ['plan', 'dashboard', 'repository'].forEach(function (t) { $('v-' + t).setAttribute('aria-hidden', String(t !== S.tab)); });
    if (focusId) {
      var el = $(focusId);
      if (el) { if (val !== null && el.value !== val) el.value = val; el.focus({ preventScroll: true }); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch (e) { } }
    }

  });
}
function hc(h) { return 'style="--hc:var(--h-' + h + ')"'; }
function itemsOf(h, period) { return S.items.filter(function (it) { return it.horizon === h && it.period === period; }).sort(function (a, b) { return a.order - b.order || (a.createdAt < b.createdAt ? -1 : 1); }); }
function byIdMap() { var m = {}; S.items.forEach(function (it) { m[it.id] = it; }); return m; }
function hasDemo() { return S.items.some(function (it) { return it.source === 'demo'; }) || S.repo.some(function (r) { return /^Demo row/i.test(r.Notes || ''); }); }
function timeOf(iso) { return iso.slice(11, 16); }
function hm12(iso) { var h = Number(iso.slice(11, 13)), m = iso.slice(14, 16); var ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + (m === '00' ? '' : ':' + m) + ap; }
function agoText(ts) { if (!ts) return 'not synced yet'; var m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'updated just now' : m === 1 ? 'updated 1 min ago' : m < 60 ? 'updated ' + m + ' min ago' : 'updated ' + Math.round(m / 60) + ' h ago'; }

function renderHeader() {

  $('fab').textContent = (S.settings.assistantName || 'Go').slice(0, 3);
}

/* ---------- Plan ---------- */
function renderPlan() {
  var h = S.horizon, period = S.keys[h];
  var byId = byIdMap(), byParent = indexByParent(S.items);
  var out = [];
  if (S.error) out.push('<div class="banner"><span>' + esc(S.error) + '</span><button class="btn sm" data-act="refresh">Retry</button></div>');
  if (!API.isGs() && !API.isDemo() && !API.url()) out.push('<div class="banner"><span>Not connected to your sheet yet.</span><button class="btn sm primary" data-act="settings">Connect</button></div>');
  if (hasDemo()) out.push('<div class="banner"><span>You are looking at example data.</span><button class="btn sm" data-act="cleardemo">Clear demo data</button></div>');

  out.push('<div class="hstrip" role="tablist">');
  HORIZONS.forEach(function (x, i) {
    var st = periodStats(S.items, x, S.keys[x]);
    out.push('<button role="tab" ' + hc(x) + ' data-act="horizon" data-h="' + x + '" aria-selected="' + (x === h) + '" title="' + HLABEL[x] + ' (' + (i + 1) + ')"><span class="n">' + HSHORT[x] + '</span><span class="c">' + st.done + '/' + st.total + '</span><span class="bar"><i style="width:' + st.pct + '%"></i></span></button>');
  });
  out.push('</div>');

  var st = periodStats(S.items, h, period);
  var headline = st.total === 0 ? 'Nothing planned' : st.left === 0 ? 'All done' : st.left + (st.left === 1 ? ' thing left' : ' things left');
  var circ = 2 * Math.PI * 24;
  out.push('<div class="head"><div><h2>' + headline + '</h2><div class="sub">' + esc(periodLabel(h, period, S.today)) + (st.total ? ' · ' + st.done + ' of ' + st.total + ' done' : '') + '</div></div>' +
    '<svg class="ring" viewBox="0 0 56 56" ' + hc(h) + ' aria-label="' + st.pct + '% done"><circle class="bg" cx="28" cy="28" r="24"/><circle class="fg" cx="28" cy="28" r="24" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ * (1 - st.pct / 100)).toFixed(1) + '"/><text x="28" y="33" text-anchor="middle">' + st.pct + '%</text></svg></div>');

  out.push('<div class="addbox"><input id="add-input" data-draft placeholder="' + (h === 'day' ? 'Add something for today' : 'Add a goal for ' + HLABEL[h].toLowerCase()) + '" aria-label="Add item" autocomplete="off" enterkeyhint="done"><button class="btn primary" data-act="add">Add</button></div>');
  if (h !== 'day') out.push('<label class="chk"><input type="checkbox" data-act="plansteps" ' + (S.planSteps ? 'checked' : '') + '> Also plan the steps into smaller periods</label>');

  // list controls
  out.push('<div class="rowbar"><div class="seg"><button data-act="showdone" data-v="0" aria-selected="' + !S.showDone + '">In progress</button><button data-act="showdone" data-v="1" aria-selected="' + S.showDone + '">Completed</button></div><div style="display:flex;gap:6px"><button class="btn sm ghost" data-act="suggest" title="Suggest items from your goals, calendar and mail">✦ Suggest</button><button class="btn sm ghost" data-act="import">Import</button></div></div>');

  var list = itemsOf(h, period).filter(function (it) { return S.showDone ? it.done : !it.done; });
  if (!list.length) {
    out.push('<div class="empty">' + (S.showDone ? '<b>Nothing completed yet</b>Tick an item and it will show here.' : st.total ? '<b>All done here</b>Add something new, or tap ✦ Suggest.' : '<b>Nothing planned yet</b>Type above and press Enter, or tap ✦ Suggest.') + '</div>');
  } else {

      });

    out.push('</div>');
    var mail = (S.mail || []).slice(0, 5);
    if (mail.length) {

        out.push('<div class="srow"><div class="t"><a href="' + esc(m.link) + '" target="_blank" rel="noopener">' + esc(m.subject) + '</a><span class="tiny">' + esc(m.from.replace(/<.*>/, '').trim()) + (m.snippet ? ' — ' + esc(m.snippet.slice(0, 70)) : '') + '</span></div><div class="acts"><button class="btn sm" data-act="follow-mail" data-subject="' + esc(m.subject) + '" data-from="' + esc(m.from.replace(/<.*>/, '').trim()) + '">+ Follow up</button></div></div>');

  $('v-plan').innerHTML = out.join('');
}

function renderItem(it, byId, byParent, idx, len) {

/* ---------- Dashboard ---------- */
function renderDashboard() {

    var p = Math.round(progressOf(it, byParent, memo) * 100);

  }
  var roots = S.items.filter(function (it) { return (!it.parentId || !byId[it.parentId]) && (byParent[it.id] || []).length && (it.period === S.keys[it.horizon] || !it.done); }).sort(function (a, b) { return hIndex(b.horizon) - hIndex(a.horizon) || a.order - b.order; });
  out.push(roots.length ? '<ul class="tree">' + roots.map(node).join('') + '</ul>' : '<div class="empty"><b>No goals with steps yet</b>Add a goal for this year or quarter and plan its steps.</div>');
  out.push('</div>');

  // 14-day chart
  var days = [], max = 1;
  for (var i = 13; i >= 0; i--) { var k = addDays(S.today, -i); var n = S.items.filter(function (it) { return it.done && it.doneOn === k; }).length; days.push({ k: k, n: n }); if (n > max) max = n; }
  out.push('<div class="block"><h3>Completed per day <span class="tiny">last 14 days</span></h3><svg class="chart" viewBox="0 0 280 120" preserveAspectRatio="none" aria-label="Completed per day">');
  days.forEach(function (d, i) {

  // needs attention

  S.items.filter(function (it) { return !it.done && it.horizon !== 'day' && it.period === S.keys[it.horizon] && !(byParent[it.id] || []).some(function (k) { return !k.done; }); }).forEach(function (it) { att.push({ it: it, why: 'no open steps', fix: '<button class="btn sm" data-act="plan-goal" data-id="' + it.id + '">✦ Plan steps</button>' }); });

}

<script>
/* ============================================================ Sync */
function applyState(st) {

  S.settings = st.settings || {}; S.calendar = st.calendar || { today: [], week: [], all: [] };

}
function refresh(quiet) {

    .catch(function (e) { S.error = friendly(e); render(); })
    .then(function () { S.loading = false; });
}
function friendly(e) {

  if (/older version|not a function|Unknown action/i.test(m)) return 'The script is on an older version — Deploy → Manage deployments → New version.';
  if (/Gemini key|API key/i.test(m)) return m;
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Could not reach the script. Check the link in Settings and your connection.';
  return m;

  'carry-move': function (el) { var it = findItem(el.dataset.id); var before = updateItem(it.id, { period: S.keys[it.horizon], order: itemsOf(it.horizon, S.keys[it.horizon]).length + 1 }); toast('Moved to ' + HLABEL[it.horizon].toLowerCase(), function () { updateItem(it.id, before); }); },
  'carry-done': function (el) { setDone(el.dataset.id, true); },
  'plan-goal': function (el) { if (!S.settings.aiReady && !API.isDemo()) { toast('Add an AI key in Settings to plan steps.'); openSheet('sh-settings'); renderSettings(); return; } planGoal(el.dataset.id); },
  suggest: function () { if (!S.settings.aiReady && !API.isDemo()) { toast('Add an AI key in Settings to get suggestions.'); openSheet('sh-settings'); renderSettings(); return; } openSheet('sh-assistant'); renderChat(); pushChat({ role: 'sys', text: 'Suggesting items for ' + HLABEL[S.horizon].toLowerCase() + '…' }); sendMessage('', 'suggest', { horizon: S.horizon }); },
  'plan-event': function (el) { var it = addItem('Prepare for ' + el.dataset.title, 'day', { ref: el.dataset.title, source: 'calendar' }); toast('Added "' + it.text.slice(0, 40) + '"', function () { deleteItemUI(it.id); closeToast(); }); },
  'follow-mail': function (el) { var it = addItem('Follow up: ' + el.dataset.subject.replace(/^(re|fwd?):\s*/i, ''), 'day', { ref: el.dataset.from }); toast('Added "' + it.text.slice(0, 40) + '"', function () { deleteItemUI(it.id); closeToast(); }); },
  'rec-plan': function (el) { var r = recByName(el.dataset.name); var h = el.dataset.h || 'day'; var it = addItem((r && r.Type === 'Contact' ? 'Reach out to ' : 'Follow up on ') + el.dataset.name, h, { ref: el.dataset.name }); toast('Added to ' + HLABEL[h].toLowerCase(), function () { deleteItemUI(it.id); closeToast(); }); },
  refresh: function () { S.error = ''; refresh(); },
  settings: function () { renderSettings(); openSheet('sh-settings'); },
  closeall: function () { closeSheets(); },
  savesettings: function () {
    var obj = { provider: $('set-provider').value, userName: $('set-name').value.trim(), assistantName: $('set-aname').value.trim() || 'Go', language: $('set-lang').value, mailLookbackDays: $('set-mail').value.trim() || '7', calendarDays: $('set-cal').value.trim() || '7' };
    if ($('set-model')) obj.geminiModel = $('set-model').value.trim();
    if ($('set-key') && $('set-key').value.trim()) obj.geminiKey = $('set-key').value.trim();
    if ($('set-llmbase')) { obj.llmBase = $('set-llmbase').value.trim(); obj.llmModel = $('set-llmmodel').value.trim(); if ($('set-llmkey').value.trim()) obj.llmKey = $('set-llmkey').value.trim(); }
    if ($('set-api')) localStorage.setItem(LS.api, $('set-api').value.trim());
    save('saveSettings', { settings: obj }).then(function (s) { S.settings = s; toast('Settings saved'); renderSettings(); render(); }).catch(function () { });
  },
  provider: function (el) { S.settings.provider = el.value; renderSettings(); },
  connect: function () {
    var url = $('set-api').value.trim(); if (!url) { $('connect-status').textContent = 'Paste the /exec link first.'; return; }
    localStorage.setItem(LS.api, url); $('connect-status').textContent = 'Checking…';
    API.ping(url).then(function (r) { $('connect-status').textContent = 'Connected (script v' + r.version + ', ' + r.tz + ').'; refresh(); }).catch(function () { $('connect-status').textContent = 'Could not reach it. The deployment must be a Web app with access "Anyone, even anonymous", and the link must end in /exec.'; });
  },
  selfcheck: function () {
    $('selfcheck-out').innerHTML = '<div class="tiny">Checking…</div>';
    enqueue(function () { return API.call('selfCheck'); }).then(function (r) {
      $('selfcheck-out').innerHTML = '<div class="check"><div class="tiny">' + esc(r.summary) + '</div>' + r.checks.map(function (c) { return '<div class="c"><span class="' + (c.ok ? 'ok' : 'bad') + '">' + (c.ok ? '✓' : '✕') + '</span><div><b>' + esc(c.name)+ '</b> — ' + esc(c.detail) + (c.ok ? '' : '<div class="fix">' + esc(c.fix || '') + '</div>') + '</div></div>'; }).join('') + '</div>';
    }).catch(function (e) { $('selfcheck-out').innerHTML = '<div class="tiny" style="color:var(--danger)">' + esc(friendly(e)) + '</div>'; });
  },
  backup: function () {
    enqueue(function () { return API.call('exportBackup'); }).then(function (b) {
      var blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'tmc-planner-backup-' + S.today + '.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded');
    }).catch(function (e) { toast(friendly(e)); });
  },
  restore: function () { $('restore-file').click(); },
  cleardemo: function () { confirmBox('Remove all example items and example records? Your own data stays.', 'Clear demo data', function () { S.items = S.items.filter(function (x) { return x.source !== 'demo'; }); S.repo = S.repo.filter(function (r) { return !/^Demo row/i.test(r.Notes || ''); }); render(); save('clearDemoData', {}).then(function () { toast('Demo data cleared'); }).catch(function () { }); }); },
  import: function () { IMP.items = null; renderImport(); openSheet('sh-import'); },
  'imp-parse': importParse,
  'imp-back': function () { IMP.items = null; renderImport(); },
  'imp-add': importAdd,
  'imp-check': function (el) { IMP.items[Number(el.dataset.i)].include = el.checked; var b = document.querySelector('[data-act="imp-add"]'); if (b) b.textContent = 'Add ' + IMP.items.filter(function (x) { return x.include !== false; }).length + ' items'; },
  'imp-h': function (el) { IMP.items[Number(el.dataset.i)].horizon = el.value; },
  newrec: function () { S.newRec = true; S.editRec = null; render(); setTimeout(function () { var f = $('rf-Name'); if (f) f.focus(); }, 30); },
  openrec: function (el) { if (S.editRec) return; S.openRec = S.openRec === el.dataset.name ? null : el.dataset.name; render(); },
  editrec: function (el) { S.editRec = el.dataset.name; S.newRec = false; render(); },
  cancelrec: function () { S.editRec = null; S.newRec = false; render(); },
  saverec: function () {
    var row = readRecForm(), orig = $('recform').dataset.orig;
    if (!row.Name) { toast('A record needs a name.'); $('rf-Name').focus(); return; }
    if (row.Due && !/^\d{4}-\d{2}-\d{2}$/.test(row.Due)) { toast('Due must look like 2026-10-31.'); $('rf-Due').focus(); return; }
    if (orig) { var i = S.repo.findIndex(function (r) { return r.Name === orig; }); var before = S.repo[i]; S.repo[i] = Object.assign({}, before, row, { _updated: Date.now() }); S.editRec = null; render(); save('updateRecord', { name: orig, patch: row }, function () { S.repo[i] = before; }).then(function () { toast('Saved'); }).catch(function () { }); }
    else { if (recByName(row.Name)) { toast('A record with that name already exists.'); return; } row._updated = Date.now(); S.repo.unshift(row); S.newRec = false; S.openRec = row.Name; render(); save('addRecord', { row: row }, function () { S.repo = S.repo.filter(function (r) { return r !== row; }); }).then(function () { toast('Added'); }).catch(function () { }); }
  },
  delrec: function (el) { var n = el.dataset.name; confirmBox('Delete "' + n + '" from the repository?', 'Delete', function () { var r = recByName(n); S.repo = S.repo.filter(function (x) { return x.Name !== n; }); S.openRec = null; render(); save('deleteRecord', { name: n }, function () { S.repo.push(r); }).then(function () { toast('Deleted "' + n + '"'); }).catch(function () { }); }); },
  repotype: function (el) { S.repoType = el.dataset.t; render(); },
  reposort: function (el) { S.repoSort = el.dataset.s; render(); },
  assistant: function () { openSheet('sh-assistant'); renderChat(); setTimeout(function () { if (window.innerWidth >= 900) $('ask-input').focus(); }, 50); },
  clearchat: function () { S.chat = []; renderChat(); saveLocal(); },
  send: function () { var t = $('ask-input').value; $('ask-input').value = ''; $('ask-input').style.height = ''; voiceReplyWanted = false; sendMessage(t, 'chat'); },
  chip: function (el) { var c = el.dataset.c; if (/…$/.test(c)) { $('ask-input').value = c.replace('…', ''); $('ask-input').focus(); return; } voiceReplyWanted = false; sendMessage(c, 'chat'); },
  mic: function () { if (listening) { stopVoice(); return; } voiceReplyWanted = true; startVoice(false); },
  live: function () { if (live) { stopVoice(); pushChat({ role: 'sys', text: 'Live mode off.' }); return; } live = true; voiceReplyWanted = true; pushChat({ role: 'sys', text: 'Live mode on — say "done" or "bas" to stop.' }); startVoice(true); },
  stopvoice: function () { stopVoice(); },
  'chat-undo': function (el) { undoChange(Number(el.dataset.i), Number(el.dataset.j)); },
  'copy-draft': function (el) { var d = S.chat[Number(el.dataset.i)].drafts[Number(el.dataset.j)]; var t = (d.to ? 'To: ' + d.to + '\n' : '') + 'Subject: ' + d.subject + '\n\n' + d.body; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Copied'); }, function () { toast('Copy is not allowed here — select the text instead.'); }); },
  undo: function () { if (undoFn) { var f = undoFn; closeToast(); f(); } },
  toastclose: closeToast,
  'confirm-yes': function () { var f = confirmFn; closeConfirm(); if (f) f(); },
  'confirm-no': closeConfirm
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  if (el.tagName === 'A') return;
  var fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox')) { var fn = ACT[el.dataset.act]; if (fn) fn(el, e); }
});
document.addEventListener('keydown', function (e) {
  var t = e.target, inField = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if (e.key === 'Escape') {
    if (S.editItem) { S.editItem = null; render(); return; }
    if ($('confirm').dataset.open === 'true') { closeConfirm(); return; }
    if (document.querySelector('.sheet[data-open="true"]')) { closeSheets(); return; }
    if (t.id === 'repo-q') { S.repoQ = ''; t.value = ''; render(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    if (t.id === 'add-input') { e.preventDefault(); ACT.add(); return; }
    if (t.dataset && t.dataset.actKey === 'edit') { e.preventDefault(); var v = t.value.trim(); var id = t.dataset.id; S.editItem = null; if (v && v !== findItem(id).text) updateItem(id, { text: v.slice(0, 500) }); else render(); return; }
    if (t.id === 'ask-input') { e.preventDefault(); ACT.send(); return; }
    if (t.closest && t.closest('#recform') && t.tagName === 'INPUT') { e.preventDefault(); ACT.saverec(); return; }
  }
  if (inField) return;
  if (e.key === '/') { e.preventDefault(); if (S.tab !== 'repository') { S.tab = 'repository'; render(); } setTimeout(function () { var q = $('repo-q'); if (q) q.focus(); }, 40); }
  else if (/^[1-5]$/.test(e.key) && !e.metaKey && !e.ctrlKey) { S.tab = 'plan'; S.horizon = HORIZONS[Number(e.key) - 1]; render(); }
  else if (e.key === 'g' && !e.metaKey && !e.ctrlKey) { ACT.assistant(); }
  else if (e.key === 'n' && !e.metaKey && !e.ctrlKey) { S.tab = 'plan'; render(); setTimeout(function () { var a = $('add-input'); if (a) a.focus(); }, 40); }
});
document.addEventListener('focusout', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.actKey === 'edit') { var id = t.dataset.id, v = t.value.trim(); if (S.editItem === id) { S.editItem = null; var it = findItem(id); if (v && it && v !== it.text) updateItem(id, { text: v.slice(0, 500) }); else render(); } }
  if (t.dataset && t.dataset.actKey === 'note') { var it2 = findItem(t.dataset.id); if (it2 && it2.note !== t.value) updateItem(it2.id, { note: t.value }); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'repo-q') { S.repoQ = t.value; render(); }
  if (t.id === 'ask-input') { t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'restore-file' && t.files[0]) {
    t.files[0].text().then(function (txt) { var b = JSON.parse(txt); confirmBox('Replace all items' + (b.repository ? ' and records' : '') + ' with this backup (' + (b.items || []).length + ' items)?', 'Import backup', function () { save('importBackup', { backup: b }).then(function () { toast('Backup imported'); refresh(); }).catch(function () { }); }); }).catch(function () { toast('That file is not a TMC Planner backup.'); });
    t.value = '';
  }
  if (t.id === 'imp-file' && t.files[0]) { readFile(t.files[0]).then(function (txt) { IMP.text = txt; $('imp-text').value = txt; importParse(); }).catch(function (err) { toast(friendly(err)); }); t.value = ''; }
});
document.addEventListener('dragover', function (e) { var d = $('drop'); if (d && $('sh-import').dataset.open === 'true') { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function () { var d = $('drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) { var d = $('drop'); if (d && $('sh-import').dataset.open === 'true') { e.preventDefault(); d.classList.remove('over'); var f = e.dataTransfer.files[0]; if (f) readFile(f).then(function (txt) { IMP.text = txt; $('imp-text').value = txt; importParse(); }).catch(function (err) { toast(friendly(err)); }); } });
document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - S.lastSync > 5 * 60000) refresh(true); });
setInterval(function () { if (!document.hidden) refresh(true); }, 5 * 60000);
window.addEventListener('hashchange', function () { refresh(); });
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () { synthVoice = pickVoice(); };

/* ============================================================ PWA manifest (inline, so the single file installs) */
(function () {
  var icon = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='#1F6F5F'/><path d='M18 33l9 9 19-20' fill='none' stroke='#fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  var man = { name: 'TMC Planner', short_name: 'TMC', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#F7F7F4', theme_color: '#1F6F5F', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }] };
  try { $('manifest').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man))); } catch (e) { }
})();

/* ============================================================ Init */
loadLocal();
S.today = todayKey(); S.keys = periodKeys(S.today);
render();
renderChat();
refresh(!!S.lastSync);
</script>
</body>
</html>
